<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{
    max-width: 640px;
    margin: 0 auto;
    padding: 24px;
    font-family: "Microsoft YaHei",sans-serif;
    font-size: 16px;
    line-height: 1.7;
  }
  img{
  max-width: 100%;
  height: auto;
  border-radius: 8px;}
  h1{
      text-align: center;
      margin: 0;
    }
      .row {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }
    .left {
      flex: 1;
    }
    .right {
      width: 180px;
      flex: none;
    }
        @media (max-width: 600px) {
      .row {
        flex-direction: column;
      }
      .right {
        width: 100%;
      }
    }
  </style>
  <title>JSherlock的学习屋</title>
</head>
<body>

  <!-- ========== TODO 1：下面四个标签的文字，全部换成你自己的 ========== -->

  <!-- 一级标题：你的名字 -->
  <div class="row">
    <div class="left">
      <h1>JSherlock</h1>
      <p>大家好！我是JSherlock，这是我做的第一个网站，用于记录我学习AI的过程，很高兴跟你们分享！</p>
    </div>

    <!-- 一张图：右边这一栏放照片 -->
    <div class="right">
      <img src="photo.jpg" alt="我的照片">
    </div>
  </div>



  <!-- 一个链接：指向你想让别人看的地址 -->
  <a href="https://www.doubao.com">豆包官网</a>

  <!-- ========== TODO 2：在下面 body 结束前，自己加一个========== -->
<h2>今天在用豆包学习个人网站建立</h2>
</body>
</html>
